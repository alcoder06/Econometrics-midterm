# Rebuilds the site and its pack list on every push (including a pack uploaded on github.com) and deploys it to GitHub Pages.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the site and packs/index.json
        run: python build.py --site
      - name: Collect the files to publish
        run: |
          mkdir -p _site/packs
          cp index.html .nojekyll _site/
          cp packs/*.json _site/packs/
          cp -r docs _site/docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
